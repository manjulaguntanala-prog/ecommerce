<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - ShopEasy</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header>

    <nav class="navbar">

        <h1>ShopEasy</h1>

        <div class="nav-links">

            <a href="index.html">Home</a>

            <a href="products.html">Products</a>

            <a href="cart.html">Cart 🛒</a>

        </div>

    </nav>

</header>


<main>

    <h2 class="section-title">
        Checkout
    </h2>


    <div class="checkout-container">

        <form id="checkoutForm">

            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >


            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >


            <label>Phone Number</label>

            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                required
            >


            <label>Address</label>

            <textarea
                id="address"
                placeholder="Enter your address"
                required
            ></textarea>


            <label>Payment Method</label>

            <select id="payment">

                <option value="COD">
                    Cash on Delivery
                </option>

                <option value="UPI">
                    UPI
                </option>

                <option value="Card">
                    Credit / Debit Card
                </option>

            </select>


            <button
                type="submit"
                class="checkout-button"
            >
                Place Order
            </button>

        </form>

    </div>

</main>


<footer>

    <p>© 2026 ShopEasy</p>

</footer>


<script src="script.js"></script>

</body>

</html>
